name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Block investigation data and secrets in the public repo
        run: |
          if git ls-files | grep -E '\.(sqlite3?|db)$|(^|/)runs/|(^|/)\.env$'; then
            echo "Investigation data or secrets are tracked in git" && exit 1
          fi
